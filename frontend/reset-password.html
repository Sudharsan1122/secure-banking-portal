<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | SecureBank</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="mfa-container">
        <main class="mfa-card" id="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
                <span class="badge badge-warning">Credential Reset</span>
                <button type="button" class="btn btn-ghost btn-sm btn-icon" data-theme-toggle aria-label="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>

            <!-- SVG Lock Icon -->
            <div class="mfa-icon-wrap" aria-hidden="true">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <h1 class="h2" style="margin-bottom: var(--space-1);">Create New Password</h1>
            <p class="body" style="color: var(--text-muted); margin-bottom: var(--space-4);">
                Enter your replacement master credentials to restore account access
            </p>

            <div id="errorAlert" class="alert alert-danger" style="display: none;" role="alert"></div>
            <div id="successAlert" class="alert alert-success" style="display: none;" role="status"></div>

            <!-- Cryptographic Token Verification Badge -->
            <div class="card" style="background-color: var(--bg-subtle); padding: var(--space-3); margin-bottom: var(--space-4); text-align: left; font-size: 0.8125rem;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <span style="font-weight: 600; color: var(--text-secondary);">Authorization Token:</span>
                    <span class="badge badge-neutral" style="font-size: 0.75rem;">SHA-256</span>
                </div>
                <div id="tokenPreview" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; word-break: break-all;">
                    Validating cryptographic token...
                </div>
            </div>

            <form id="resetForm" autocomplete="off" novalidate style="text-align: left;">
                <input type="hidden" id="resetToken" value="">

                <div class="field" id="newPasswordField" style="margin-bottom: var(--space-4);">
                    <label for="newPassword" class="field-label">New Master Password</label>
                    <div class="field-input-wrap">
                        <input type="password" id="newPassword" class="field-input" placeholder="••••••••••••" required autofocus>
                        <button type="button" id="toggleNewPassBtn" class="field-action-btn" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="field-hint">Minimum 8 characters with uppercase, lowercase, digit, and symbol.</span>
                </div>

                <div class="field" id="confirmPasswordField" style="margin-bottom: var(--space-4);">
                    <label for="confirmPassword" class="field-label">Confirm New Password</label>
                    <div class="field-input-wrap">
                        <input type="password" id="confirmPassword" class="field-input" placeholder="••••••••••••" required>
                        <button type="button" id="toggleConfirmPassBtn" class="field-action-btn" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: var(--space-2);">
                    <span>Update Password & Terminate Sessions</span>
                </button>
            </form>

            <div style="margin-top: var(--space-6); font-size: 0.875rem;">
                <a href="login.html" style="color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    <span>Back to Sign In</span>
                </a>
            </div>
        </main>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="../js/theme.js"></script>
    <script src="../js/components/toast.js"></script>
    <script src="../js/reset_password.js"></script>
</body>
</html>
