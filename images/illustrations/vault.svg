<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <!-- Glowing Atmospheric Background Elements -->
  <circle cx="200" cy="160" r="130" fill="url(#vault_glow)" opacity="0.15"/>
  <circle cx="200" cy="160" r="100" stroke="#1E5EFF" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="200" cy="160" r="80" stroke="#00B87C" stroke-width="1" stroke-dasharray="2 4" opacity="0.25"/>

  <!-- Vault Body -->
  <rect x="110" y="70" width="180" height="180" rx="28" fill="#0B1F3A" stroke="#1E5EFF" stroke-width="2"/>
  <rect x="120" y="80" width="160" height="160" rx="20" fill="#0F2748" stroke="#334155" stroke-width="1"/>

  <!-- Heavy Vault Door Wheel -->
  <circle cx="200" cy="160" r="54" fill="#0B1F3A" stroke="#1E5EFF" stroke-width="3"/>
  <circle cx="200" cy="160" r="42" fill="#071324" stroke="#00B87C" stroke-width="1.5"/>

  <!-- Spokes of the Wheel -->
  <line x1="200" y1="118" x2="200" y2="202" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="158" y1="160" x2="242" y2="160" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="170" y1="130" x2="230" y2="190" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="170" y1="190" x2="230" y2="130" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Center Hub Dial with Status Indicator -->
  <circle cx="200" cy="160" r="18" fill="#1E5EFF"/>
  <circle cx="200" cy="160" r="7" fill="#00B87C"/>

  <!-- Floating Holographic Digital Security Nodes -->
  <g transform="translate(60, 40)" opacity="0.85">
    <rect width="64" height="28" rx="6" fill="#0F172A" stroke="#1E5EFF" stroke-width="1"/>
    <text x="32" y="18" fill="#00B87C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">AES-256</text>
  </g>
  <g transform="translate(276, 250)" opacity="0.85">
    <rect width="64" height="28" rx="6" fill="#0F172A" stroke="#00B87C" stroke-width="1"/>
    <text x="32" y="18" fill="#00B87C" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">ACID 100%</text>
  </g>

  <!-- Gradients -->
  <defs>
    <radialGradient id="vault_glow" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#1E5EFF"/>
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
